<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="alternate" type="application/rss+xml" title="Giovanni Lupo" href="/feed.xml">
  <style>
    :root { --pad: 20px; --hover-color: #6a2548; --base-color: #000; }
    @font-face { font-family: "GioCustom"; src: url("/acidic.woff2") format("woff2"), url("/acidic.ttf") format("truetype"); font-weight: 400 900; font-style: normal; font-display: swap; }
    html, body { margin: 0; min-height: 100%; }
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: "GioCustom", "New Century Schoolbook", "TeX Gyre Schola", serif; background: #fff; color: #000; padding: var(--pad); }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 16px; }
    h1.pagetitle { font-size: clamp(24px, 4vw, 42px); font-weight: 800; margin: 0; }
    nav { display: flex; gap: 20px; font-size: 1em; flex-wrap: wrap; }
    nav a { color: var(--base-color); text-decoration: none; transition: color 200ms ease; white-space: nowrap; }
    nav a:hover { color: var(--hover-color); }
    main { max-width: 720px; margin: 0 auto; }
    a { color: var(--hover-color); }
    .post-date { font-size: 0.85em; opacity: 0.6; }
    .post-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .post-tag { font-size: 0.75em; padding: 3px 10px; background: #f5f5f5; border-radius: 2px; }
    .post-item { padding: 22px 0; border-bottom: 1px solid #eee; }
    .post-item h2 { margin: 4px 0 8px 0; font-size: 1.3em; font-weight: 800; }
    .post-item h2 a { color: var(--base-color); text-decoration: none; }
    .post-item h2 a:hover { color: var(--hover-color); }
    .post-excerpt { margin: 0; font-size: 0.95em; line-height: 1.5; opacity: 0.85; }
    .post-header h2 { font-size: clamp(22px, 3.4vw, 34px); font-weight: 800; margin: 0 0 6px 0; line-height: 1.2; }
    .post-body { font-size: 1em; line-height: 1.7; margin-top: 28px; }
    .post-body h2 { font-size: 1.25em; font-weight: 800; margin: 1.6em 0 0.5em; }
    .post-body pre { background: #f5f5f5; padding: 14px; overflow-x: auto; font-size: 0.85em; }
    .post-body code { background: #f5f5f5; padding: 1px 5px; font-size: 0.9em; }
    .post-body pre code { background: none; padding: 0; }
    .post-body blockquote { border-left: 3px solid var(--hover-color); margin: 1.5em 0; padding-left: 1em; opacity: 0.85; }
    .post-body img { max-width: 100%; height: auto; }
    .back-link { display: inline-block; margin-bottom: 24px; text-decoration: none; font-size: 0.9em; }
  </style>
  <title>{{ page.title }} | Giovanni Lupo</title>
</head>
<body>
  <header>
    <h1 class="pagetitle"><a href="/blog/" style="color:inherit;text-decoration:none;">Blog</a></h1>
    <nav>
      <a href="/">Home</a>
      <a href="/light/">Light Phone</a>
      <a href="/books/">Bookshelf</a>
      <a href="/movies/">Letterboxd</a>
      <a href="/photos/">Photos</a>
      <a href="/about/">About Me</a>
      <a href="/feed.xml">RSS</a>
    </nav>
  </header>
  <main>
    <a href="/blog/" class="back-link">&larr; Back to all posts</a>
    <div class="post-header">
      <h2>{{ page.title }}</h2>
      <div class="post-date">{{ page.date | date: "%B %-d, %Y" }}</div>
    </div>
    <div class="post-body">{{ content }}</div>
  </main>
</body>
</html>
