<script>
(function () {
  // rotating blink label
  var MARKS = ["field notes, mostly", "{{ site.posts | size }} dispatches", "still shipping", "no newsletter, sorry", "written on a real keyboard"];
  var mi = 0, mark = document.getElementById('mark');
  document.getElementById('brand').addEventListener('click', function (e) {
    if (e.detail > 0) { mi = (mi + 1) % MARKS.length; mark.textContent = MARKS[mi]; e.preventDefault(); }
  });

  // tag chips filter
  var chips = document.querySelectorAll('.chip');
  chips.forEach(function (c) {
    c.addEventListener('click', function () {
      chips.forEach(function (x) { x.classList.remove('on'); });
      c.classList.add('on');
      var tag = c.dataset.tag;
      document.querySelectorAll('.item').forEach(function (it) {
        var tags = (it.dataset.tags || '').split('|');
        it.style.display = (!tag || tags.indexOf(tag) !== -1) ? '' : 'none';
      });
    });
  });

  // custom striped scrollbars
  function bar(scroller, track, thumb, minH) {
    if (!scroller || !track || !thumb) return;
    function measure() {
      var max = scroller.scrollHeight - scroller.clientHeight;
      var ratio = Math.max(0.12, Math.min(1, scroller.clientHeight / scroller.scrollHeight));
      var h = Math.max(minH, ratio * track.clientHeight);
      var f = max > 0 ? scroller.scrollTop / max : 0;
      thumb.style.height = h + 'px';
      thumb.style.top = (f * (track.clientHeight - h)) + 'px';
      thumb.style.backgroundPosition = '0 ' + (-scroller.scrollTop) + 'px';
    }
    scroller.addEventListener('scroll', measure);
    track.addEventListener('wheel', function (e) { e.preventDefault(); scroller.scrollTop += e.deltaY * 1.6; }, { passive: false });
    track.addEventListener('click', function (e) {
      if (e.target === thumb) return;
      var r = track.getBoundingClientRect(), th = thumb.getBoundingClientRect();
      var f = Math.min(1, Math.max(0, (e.clientY - r.top - th.height / 2) / Math.max(1, r.height - th.height)));
      scroller.scrollTop = f * (scroller.scrollHeight - scroller.clientHeight);
    });
    thumb.addEventListener('mousedown', function (e) {
      e.preventDefault(); e.stopPropagation();
      var r = track.getBoundingClientRect(), th = thumb.getBoundingClientRect();
      var off = e.clientY - th.top, span = Math.max(1, r.height - th.height), raf = null, ly = e.clientY;
      document.body.style.userSelect = 'none';
      function apply() { raf = null; var f = Math.min(1, Math.max(0, (ly - off - r.top) / span)); scroller.scrollTop = f * (scroller.scrollHeight - scroller.clientHeight); }
      function move(ev) { ev.preventDefault(); ly = ev.clientY; if (!raf) raf = requestAnimationFrame(apply); }
      function up() { document.body.style.userSelect = ''; window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); }
      window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
    });
    new ResizeObserver(measure).observe(scroller);
    [60, 300, 900].forEach(function (t) { setTimeout(measure, t); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    measure();
  }

  var rs = document.getElementById('readscroll');
  bar(rs, document.getElementById('wheeltrack'), document.getElementById('wheelthumb'), 44);
  bar(document.getElementById('raillist'), document.getElementById('minitrack'), document.getElementById('minithumb'), 24);

  // reading progress
  var fill = document.getElementById('progressfill');
  if (rs && fill) {
    rs.addEventListener('scroll', function () {
      var max = rs.scrollHeight - rs.clientHeight;
      fill.style.width = (max > 0 ? (rs.scrollTop / max) * 100 : 0) + '%';
    });
  }

  // keep the selected post visible in the rail
  var on = document.querySelector('.item.on');
  if (on) on.scrollIntoView({ block: 'center' });
})();
</script>
